<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/site-icon.png" />
  <title>Dovelora</title>
  <!--storefront-head-->
  <style>
    html,
    body,
    #app {
      min-height: 100%;
      margin: 0;
    }

    .storefront-initial-content {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px;
      font: 16px/1.6 system-ui, sans-serif;
    }

    .storefront-initial-content article {
      margin: 24px 0;
      padding: 16px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .storefront-initial-content img {
      max-width: 100%;
      height: auto;
    }

    .storefront-boot {
      display: none;
    }

    .storefront-booting .storefront-initial-content {
      display: none;
    }

    .storefront-booting .storefront-boot {
      position: fixed;
      z-index: 1000;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #fff;
      color: #475569;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .storefront-boot img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .storefront-boot span {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .24em;
    }

    .storefront-boot-bar {
      width: 80px;
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: #eef2f7;
    }

    .storefront-boot-bar::after {
      display: block;
      width: 50%;
      height: 100%;
      border-radius: inherit;
      background: #2563eb;
      content: "";
      animation: storefront-boot-progress 1.15s ease-in-out infinite;
    }

    @keyframes storefront-boot-progress {
      from { transform: translateX(-110%); }
      to { transform: translateX(210%); }
    }

    @media (prefers-color-scheme: dark) {
      .storefront-boot {
        background: #0b1220;
        color: #cbd5e1;
      }

      .storefront-boot-bar {
        background: #1e293b;
      }
    }
  </style>
  <script data-cfasync="false">
    (() => {
      const root = document.documentElement
      root.classList.add('storefront-booting')
      const finish = () => {
        root.classList.remove('storefront-booting')
        window.clearTimeout(timeout)
      }
      const timeout = window.setTimeout(finish, 15000)
      window.addEventListener('storefront-ready', finish, { once: true })
      window.addEventListener('storefront-failed', finish, { once: true })
    })()
  </script>
</head>

<body>
  <div id="app">
    <!--storefront-content-start-->
    <!--storefront-content-end-->
  </div>
  <div class="storefront-boot" role="status" aria-live="polite" aria-label="Dovelora loading">
    <img src="/site-icon.png" alt="" />
    <span>DOVELORA</span>
    <div class="storefront-boot-bar"></div>
  </div>
  <script type="module" data-cfasync="false" src="/src/main.ts"></script>
</body>

</html>
