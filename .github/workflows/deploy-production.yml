name: deploy-production

on:
  push:
    branches:
      - main
      - agent/ghcr-production-deploy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dovelora-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish storefront image
    if: github.repository == 'dovelora/dujiao-next'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout exact Git commit
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare immutable image reference
        id: image
        shell: bash
        env:
          IMAGE_REPOSITORY: ghcr.io/dovelora/dujiao-next
        run: |
          short_sha="${GITHUB_SHA::12}"
          image_tag="gh-${short_sha}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "image_ref=${IMAGE_REPOSITORY}:${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "app_version=gh-${short_sha}" >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.image_ref }}
          build-args: APP_VERSION=${{ steps.image.outputs.app_version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=dovelora-production
          cache-to: type=gha,mode=max,scope=dovelora-production

  deploy:
    name: Pull and deploy storefront image
    needs: build
    if: github.repository == 'dovelora/dujiao-next'
    runs-on: [self-hosted, linux, x64, dovelora-production]
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Pull and deploy exact image
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" \
            | sudo -n /usr/local/sbin/dovelora-deploy \
                "${IMAGE_REF}" "${IMAGE_DIGEST}" "${GHCR_USERNAME}"

      - name: Record deployment
        if: success()
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- Commit: \`${DEPLOY_COMMIT}\`"
            echo "- Image: \`${IMAGE_REF}@${IMAGE_DIGEST}\`"
            echo "- Storefront: https://www.dovelora.com/"
            echo "- Payment service: excluded from deployment"
          } >> "${GITHUB_STEP_SUMMARY}"
